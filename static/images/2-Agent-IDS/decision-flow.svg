<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <style>
      .t{font-weight:600;fill:#263238}
      .s{font-size:12px;fill:#455a64}
      .lbl{font-size:12px;fill:#37474f;font-style:italic}
      .flow{stroke:#37474f;stroke-width:2;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1100" height="560" fill="#ffffff"/>
  <text x="550" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#283e5b">How the agent decides — the LangGraph StateGraph</text>

  <!-- event -->
  <rect x="20" y="200" width="150" height="110" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="95" y="228" text-anchor="middle" class="t">Event</text>
  <text x="95" y="250" text-anchor="middle" class="s">IDS alert, web line,</text>
  <text x="95" y="266" text-anchor="middle" class="s">or both joined</text>
  <text x="95" y="288" text-anchor="middle" class="s">payload fenced in</text>
  <text x="95" y="303" text-anchor="middle" class="s">&lt;&lt;UNTRUSTED_DATA&gt;&gt;</text>

  <!-- triage -->
  <rect x="220" y="185" width="200" height="140" rx="8" fill="#e0f7fa" stroke="#00838f" stroke-width="1.5"/>
  <text x="320" y="212" text-anchor="middle" class="t">1. triage</text>
  <text x="320" y="234" text-anchor="middle" class="s">one LLM call per event</text>
  <text x="320" y="251" text-anchor="middle" class="s">(TRIAGE_BATCH=1)</text>
  <text x="320" y="273" text-anchor="middle" class="s">JSON schema output:</text>
  <text x="320" y="290" text-anchor="middle" class="s">reason → action → type,</text>
  <text x="320" y="307" text-anchor="middle" class="s">confidence, MITRE, note</text>
  <path d="M170,255 L218,255" class="flow"/>

  <!-- route diamond -->
  <polygon points="520,190 600,255 520,320 440,255" fill="#fffde7" stroke="#f9a825" stroke-width="1.5"/>
  <text x="520" y="250" text-anchor="middle" class="t">route</text>
  <text x="520" y="268" text-anchor="middle" class="s">confidence?</text>
  <path d="M420,255 L438,255" class="flow"/>

  <!-- investigate -->
  <rect x="440" y="380" width="230" height="130" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="555" y="407" text-anchor="middle" class="t">2. investigate (ReAct)</text>
  <text x="555" y="429" text-anchor="middle" class="s">up to 3 steps, read-only tools:</text>
  <text x="555" y="446" text-anchor="middle" class="s">recent alerts / web log of this IP</text>
  <text x="555" y="463" text-anchor="middle" class="s">(15-min window, fenced output)</text>
  <text x="555" y="485" text-anchor="middle" class="s">then one final decision</text>
  <path d="M520,320 L520,378" class="flow"/>
  <text x="530" y="352" class="lbl">0.35 – 0.75 (unsure)</text>

  <!-- risk gate -->
  <polygon points="760,190 850,255 760,320 670,255" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="760" y="248" text-anchor="middle" class="t">3. risk_gate</text>
  <text x="760" y="266" text-anchor="middle" class="s">high-risk block?</text>
  <path d="M600,255 L668,255" class="flow"/>
  <text x="634" y="245" text-anchor="middle" class="lbl">sure</text>
  <path d="M670,445 C740,445 760,380 760,322" class="flow"/>

  <!-- human -->
  <rect x="660" y="60" width="200" height="85" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="760" y="86" text-anchor="middle" class="t">Human approval (HITL)</text>
  <text x="760" y="106" text-anchor="middle" class="s">dashboard button / approve.py</text>
  <text x="760" y="123" text-anchor="middle" class="s">no answer in time → warn,</text>
  <text x="760" y="138" text-anchor="middle" class="s">never an unreviewed block</text>
  <path d="M760,190 L760,147" class="flow"/>
  <text x="750" y="168" class="lbl" text-anchor="end">block with conf &lt; 0.90,</text>
  <text x="750" y="182" class="lbl" text-anchor="end">or reason not grounded in the event</text>

  <!-- act -->
  <rect x="900" y="185" width="180" height="140" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="1.5"/>
  <text x="990" y="212" text-anchor="middle" class="t">4. act</text>
  <text x="990" y="234" text-anchor="middle" class="s">write decision to SQLite</text>
  <text x="990" y="256" text-anchor="middle" class="s">block → ipset (1 h)</text>
  <text x="990" y="274" text-anchor="middle" class="s">warn → alert analyst</text>
  <text x="990" y="292" text-anchor="middle" class="s">log → keep a record</text>
  <text x="990" y="312" text-anchor="middle" class="s">optional webhook</text>
  <path d="M850,255 L898,255" class="flow"/>
  <text x="874" y="245" text-anchor="middle" class="lbl">ok</text>
  <path d="M862,102 C960,102 990,140 990,183" class="flow"/>

  <!-- fail closed note -->
  <rect x="20" y="380" width="380" height="130" rx="8" fill="#fafafa" stroke="#90a4ae" stroke-dasharray="5 4"/>
  <text x="35" y="405" class="t">Safety nets (always on)</text>
  <text x="35" y="428" class="s">• Output cut off or invalid → salvage the complete items</text>
  <text x="35" y="447" class="s">• Unknown action → warn (fail-closed per item)</text>
  <text x="35" y="466" class="s">• IDS event with no decision → rule-based verdict as warn</text>
  <text x="35" y="485" class="s">• Web event with no decision → retried twice, then warn</text>
  <text x="35" y="504" class="s">• Duplicate real-traffic alerts (same IP + rule, 5 min) → once</text>
</svg>
