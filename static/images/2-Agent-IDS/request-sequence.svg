<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
    <style>
      .hd{font-weight:600;fill:#263238;font-size:14px}
      .ll{stroke:#b0bec5;stroke-width:1.5;stroke-dasharray:5 5}
      .m{stroke:#37474f;stroke-width:1.8;fill:none;marker-end:url(#a)}
      .mr{stroke:#c62828;stroke-width:2;fill:none;marker-end:url(#r)}
      .tx{fill:#263238}
      .tm{fill:#00838f;font-size:12px;font-weight:600}
    </style>
  </defs>
  <rect width="1100" height="620" fill="#ffffff"/>
  <text x="550" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#283e5b">Life of one attack request (real traffic)</text>

  <!-- participants -->
  <g text-anchor="middle">
    <rect x="30" y="50" width="120" height="40" rx="6" fill="#ffebee" stroke="#c62828"/><text x="90" y="75" class="hd">Attacker</text>
    <rect x="190" y="50" width="120" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0"/><text x="250" y="75" class="hd">Nginx + WAF</text>
    <rect x="350" y="50" width="120" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32"/><text x="410" y="75" class="hd">DVWA</text>
    <rect x="510" y="50" width="120" height="40" rx="6" fill="#fce4ec" stroke="#ad1457"/><text x="570" y="75" class="hd">Suricata</text>
    <rect x="670" y="50" width="120" height="40" rx="6" fill="#e0f7fa" stroke="#00838f"/><text x="730" y="75" class="hd">Agent</text>
    <rect x="830" y="50" width="120" height="40" rx="6" fill="#fffde7" stroke="#f9a825"/><text x="890" y="75" class="hd">Ollama</text>
    <rect x="970" y="50" width="110" height="40" rx="6" fill="#ffebee" stroke="#c62828"/><text x="1025" y="75" class="hd">ipset</text>
  </g>
  <line x1="90" y1="90" x2="90" y2="600" class="ll"/>
  <line x1="250" y1="90" x2="250" y2="600" class="ll"/>
  <line x1="410" y1="90" x2="410" y2="600" class="ll"/>
  <line x1="570" y1="90" x2="570" y2="600" class="ll"/>
  <line x1="730" y1="90" x2="730" y2="600" class="ll"/>
  <line x1="890" y1="90" x2="890" y2="600" class="ll"/>
  <line x1="1025" y1="90" x2="1025" y2="600" class="ll"/>

  <!-- messages -->
  <text x="20" y="125" class="tm">t = 0 s</text>
  <path d="M90,130 L248,130" class="m"/><text x="170" y="122" text-anchor="middle" class="tx">GET /sqli/?id=1' OR 1=1--</text>
  <path d="M250,155 L408,155" class="m"/><text x="330" y="148" text-anchor="middle" class="tx">proxied (WAF only logs)</text>
  <path d="M410,180 L252,180" class="m"/><text x="330" y="173" text-anchor="middle" class="tx">response</text>
  <path d="M250,200 L92,200" class="m"/><text x="170" y="193" text-anchor="middle" class="tx">the request already got through</text>
  <text x="258" y="222" class="tx" font-size="12">writes access log line (request_id, src port)</text>

  <path d="M90,250 C300,250 400,250 568,250" class="m" stroke-dasharray="4 4"/>
  <text x="330" y="243" text-anchor="middle" class="tx">packet copy seen on the wire</text>
  <text x="578" y="272" class="tx" font-size="12">rule matches → eve.json alert (src port)</text>

  <text x="20" y="315" class="tm">≤ 5 s</text>
  <path d="M730,320 L572,320" class="m"/><text x="650" y="313" text-anchor="middle" class="tx">poll eve.json</text>
  <path d="M730,345 L252,345" class="m"/><text x="490" y="338" text-anchor="middle" class="tx">poll access log</text>
  <text x="738" y="372" class="tx" font-size="12">join alert + web line by source port,</text>
  <text x="738" y="388" class="tx" font-size="12">method and URI → one event</text>

  <path d="M730,415 L888,415" class="m"/><text x="810" y="408" text-anchor="middle" class="tx">triage prompt</text>
  <text x="20" y="455" class="tm">+ ~4.4 s</text>
  <path d="M890,450 L732,450" class="m"/><text x="810" y="443" text-anchor="middle" class="tx">reason + "block", 0.95</text>
  <text x="738" y="475" class="tx" font-size="12">risk_gate ok → act</text>

  <text x="20" y="515" class="tm">~15 s (MTTB)</text>
  <path d="M730,510 L1023,510" class="mr"/><text x="880" y="503" text-anchor="middle" class="tx">add attacker IP (1 h timeout)</text>
  <path d="M1025,555 C700,555 300,555 92,555" class="mr"/><text x="560" y="548" text-anchor="middle" class="tx" fill="#c62828">every later packet from that IP is dropped</text>
  <text x="550" y="595" text-anchor="middle" class="tx" font-size="12" fill="#546e7a">The IDS watches a copy of the traffic, so it never stops the first request — only the WAF in the path could. The agent stops what comes next.</text>
</svg>
